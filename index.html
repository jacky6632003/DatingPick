<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff4d6d">
<title>💕 Dating Pick 共識轉盤 (Vue 3 版)</title>
<!-- 載入 Vue 3 -->
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#ff4d6d;--pink2:#ff8fab;--blue:#5aaeff;--yellow:#ffd166;
  --green:#6bcb77;--purple:#b983ff;--text:#333;--muted:#777;
  --card:rgba(255,255,255,.94);
}
html{scroll-behavior:smooth}
body{
  min-height:100vh;color:var(--text);
  font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  background:linear-gradient(135deg,#ffe5ec 0%,#fff1f5 45%,#fff 100%);
}
button,input{font:inherit}
button{border:0}
.hero{text-align:center;padding:42px 20px 24px}
.hero h1{font-size:clamp(2.2rem,6vw,3.5rem);color:var(--pink);line-height:1.1}
.hero p{margin-top:12px;color:var(--muted);font-size:1rem}
.container{width:min(1200px,100%);margin:auto;padding:20px}
.couple-section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card{
  background:var(--card);border-radius:22px;padding:22px;
  box-shadow:0 10px 30px rgba(0,0,0,.09);
  border:1px solid rgba(255,255,255,.8);
}
.male{border-top:6px solid var(--blue)}
.female{border-top:6px solid var(--pink2)}
.card h2{margin-bottom:16px}
.input-group{display:flex;gap:10px}
.input-group input{
  min-width:0;flex:1;padding:12px 14px;border:1px solid #ddd;
  border-radius:12px;outline:none;background:#fff;
}
.input-group input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,77,109,.1)}
.primary-btn{
  background:var(--pink);color:#fff;padding:12px 16px;border-radius:12px;
  cursor:pointer;font-weight:700;white-space:nowrap
}
.primary-btn:hover{filter:brightness(.96)}
.activity-list{list-style:none;margin-top:16px;display:grid;gap:8px}
.list-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:#f7f7f8;padding:10px 12px;border-radius:12px
}
.activity-text{overflow-wrap:anywhere}
.delete-btn{
  flex:none;background:#ffe1e7;color:#d92e50;padding:7px 10px;
  border-radius:9px;cursor:pointer
}
.choice-card{margin-top:20px}
.choice-container{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px}
.choice-box h3{margin-bottom:10px}
.choice-list{display:grid;gap:7px}
.choice-label{
  display:flex;align-items:center;gap:9px;padding:9px 10px;
  border-radius:10px;background:#f7f7f8;cursor:pointer
}
.choice-label:hover{background:#f0f0f2}
.choice-label input{width:18px;height:18px;accent-color:var(--pink)}
.common-summary{
  margin-top:18px;padding:14px 16px;border-radius:14px;
  background:#fff3f6;text-align:center;color:#c92f50;font-weight:700
}
.wheel-area{text-align:center;margin-top:38px}
.wheel-container{
  position:relative;width:min(430px,88vw);aspect-ratio:1;margin:25px auto 0
}
.pointer{
  position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:22px solid transparent;
  border-right:22px solid transparent;border-top:50px solid var(--pink);
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.18));z-index:10
}
.wheel{
  width:100%;height:100%;border-radius:50%;overflow:hidden;
  border:9px solid white;box-shadow:0 14px 35px rgba(0,0,0,.18);
  transition:transform 5s cubic-bezier(.17,.67,.12,.99);
  position:relative;background:#ddd
}
.segment-label{
  position:absolute;left:50%;top:50%;transform-origin:left center;
  color:#fff;font-size:clamp(10px,2.6vw,14px);font-weight:800;
  white-space:nowrap;text-shadow:1px 1px 3px rgba(0,0,0,.5);
  max-width:42%;overflow:hidden;text-overflow:ellipsis
}
.wheel-center{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:74px;height:74px;border-radius:50%;background:#fff;
  border:7px solid #ffd8e0;z-index:5;display:grid;place-items:center;
  font-size:28px;box-shadow:0 4px 15px rgba(0,0,0,.15)
}
.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:24px}
.action-btn{
  padding:12px 16px;border-radius:12px;cursor:pointer;font-weight:700;
  background:#ffe8ee;color:#b92748
}
.action-btn.primary{background:var(--pink);color:#fff}
.action-btn.yellow{background:var(--yellow);color:#5f4a00}
.action-btn:disabled{opacity:.5;cursor:not-allowed}
.result{
  min-height:48px;margin-top:24px;font-size:22px;font-weight:800;color:var(--pink)
}
.winner-title{font-size:32px;animation:pulse 1s infinite}
.winner-item{font-size:clamp(28px,7vw,44px);margin-top:10px;overflow-wrap:anywhere}
.status{font-size:15px;color:var(--muted);margin-top:6px}
.footer{text-align:center;padding:35px 20px;color:#888}
.empty{padding:14px;color:#999;text-align:center;background:#fafafa;border-radius:12px}
.confetti{
  position:fixed;top:-20px;z-index:9999;pointer-events:none;
  animation:fall linear forwards;border-radius:2px
}
@keyframes fall{
  from{transform:translateY(0) rotate(0deg);opacity:1}
  to{transform:translateY(110vh) rotate(720deg);opacity:0}
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media(max-width:760px){
  .hero{padding-top:30px}
  .container{padding:14px}
  .couple-section,.choice-container{grid-template-columns:1fr}
  .card{padding:18px}
  .input-group{flex-direction:column}
  .primary-btn{width:100%}
  .buttons{gap:6px}
  .action-btn{flex:1 1 42%;padding:11px 10px}
}
</style>
</head>
<body>

<div id="app">
  <header class="hero">
    <h1>💕 Dating Pick</h1>
    <p>兩個人的選擇，交給命運決定</p>
  </header>

  <main class="container">
    <!-- 1. 新增活動區塊 -->
    <section class="couple-section">
      <partner-card
        v-for="partner in partners"
        :key="partner.id"
        :partner="partner"
        @add-activity="addActivity"
        @delete-activity="deleteActivity">
      </partner-card>
    </section>

    <!-- 2. 雙方意願選擇區塊 -->
    <section class="card choice-card">
      <h2>💗 雙方意願選擇</h2>
      <div class="choice-container">
        <div class="choice-box" v-for="partner in partners" :key="'choice-'+partner.id">
          <h3>{{ partner.icon }} {{ partner.title }}願意</h3>
          <div class="choice-list">
            <div v-if="!allActivities.length" class="empty">先新增一些活動</div>
            <label v-else v-for="item in allActivities" :key="item" class="choice-label">
              <input type="checkbox" :value="item" :checked="partner.selected.includes(item)" @change="toggleSelection(partner.id, item)">
              <span>{{ item }}</span>
            </label>
          </div>
        </div>
      </div>
      <div class="common-summary">
        {{ commonActivities.length ? `💕 目前有 ${commonActivities.length} 個共同意願：${commonActivities.join('、')}` : '目前有 0 個共同意願' }}
      </div>
    </section>

    <!-- 3. 轉盤區域 -->
    <section class="wheel-area">
      <h2>🎡 共識轉盤</h2>
      <div class="wheel-container">
        <div class="pointer" aria-hidden="true"></div>
        <div class="wheel" :style="wheelStyle">
          <div 
            v-for="(item, index) in currentWheelItems" 
            :key="index" 
            class="segment-label"
            :style="getSegmentStyle(index)">
            {{ item }}
          </div>
        </div>
        <div class="wheel-center">💕</div>
      </div>

      <div class="buttons">
        <button class="action-btn primary" :disabled="spinning || loading" @click="findMatch">💕 找共同意願</button>
        <button class="action-btn yellow" :disabled="spinning || loading" @click="spin(commonActivities, '共識')">🎯 共識轉盤</button>
        <button class="action-btn" :disabled="spinning || loading" @click="spin(allActivities, '全部')">🎲 全部轉盤</button>
        <button v-for="partner in partners" :key="'spin-'+partner.id" class="action-btn" :disabled="spinning || loading" @click="spin(partner.activities, partner.title)">
          {{ partner.icon }} {{ partner.title }}轉盤
        </button>
      </div>

      <div class="result" role="status">
        <div v-if="loading" class="status">⏳ 資料同步中...</div>
        <template v-else>
          <div v-if="resultState.type === 'status'" class="status">{{ resultState.msg }}</div>
          <div v-else-if="resultState.type === 'match'">
            <div>💕 雙方都願意</div>
            <div class="winner-item">{{ resultState.msg }}</div>
          </div>
          <div v-else-if="resultState.type === 'winner'">
            <div class="winner-title">🎉 恭喜抽中 🎉</div>
            <div class="winner-item">💕 {{ resultState.winner }}</div>
            <div class="status">就去做這件事吧！</div>
          </div>
          <div v-else>{{ resultState.msg }}</div>
        </template>
      </div>
    </section>
  </main>

  <footer class="footer">💕 Dating Pick · 2026</footer>
</div>

<script>
const { createApp, ref, computed, onMounted } = Vue;

const STORAGE_KEY = "lovePickDataV3";
const COLORS = ["#FF6B6B","#FFD93D","#6BCB77","#4D96FF","#B983FF","#FF8FAB","#00C2A8","#FF9F1C"];

/* 
  ======================================================
  🔌 API 服務封裝層 (API Service Layer - 全 POST 方式)
  ======================================================
*/
const API_CONFIG = {
  useMockAPI: true, // 👈 後端上線後改為 false
  baseURL: 'https://api.yourdomain.com/v1' // 後端 API 根網址
};

const apiService = {
  // 通用 POST 封裝
  async postRequest(url, bodyData = {}) {
    if (API_CONFIG.useMockAPI) {
      // 模擬網路延遲
      await new Promise(resolve => setTimeout(resolve, 100));
      return null;
    }
    const res = await fetch(`${API_CONFIG.baseURL}${url}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(bodyData)
    });
    return await res.json();
  },

  // 1. [POST] 取得所有資料
  async fetchPartnersData() {
    if (API_CONFIG.useMockAPI) {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : null;
    } else {
      const res = await this.postRequest('/partners/get');
      return res ? res.data : null;
    }
  },

  // 2. [POST] 新增活動
  async addActivity(partnerId, activityText) {
    if (API_CONFIG.useMockAPI) return { success: true };
    return await this.postRequest('/partners/activities/add', {
      partnerId,
      activity: activityText
    });
  },

  // 3. [POST] 刪除活動
  async deleteActivity(partnerId, activityText) {
    if (API_CONFIG.useMockAPI) return { success: true };
    return await this.postRequest('/partners/activities/delete', {
      partnerId,
      activity: activityText
    });
  },

  // 4. [POST] 切換意願勾選
  async toggleSelection(partnerId, activityText, selected) {
    if (API_CONFIG.useMockAPI) return { success: true };
    return await this.postRequest('/partners/selection/toggle', {
      partnerId,
      activity: activityText,
      selected
    });
  },

  // 5. [POST] 全量同步/備份 (包含 Mock 回寫 LocalStorage)
  async syncAllData(partners) {
    const dataToSave = partners.map(p => ({
      id: p.id,
      activities: p.activities,
      selected: p.selected
    }));

    if (API_CONFIG.useMockAPI) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
      return { success: true };
    } else {
      return await this.postRequest('/partners/sync', { partners: dataToSave });
    }
  }
};

// 子元件：伴侶卡片
const PartnerCard = {
  props: ['partner'],
  emits: ['add-activity', 'delete-activity'],
  template: `
    <div :class="['card', partner.cssClass]">
      <h2>{{ partner.icon }} {{ partner.title }}想做的事</h2>
      <div class="input-group">
        <input 
          v-model.trim="inputText" 
          maxlength="40" 
          :placeholder="partner.placeholder" 
          @keyup.enter="handleAdd"
          autocomplete="off">
        <button class="primary-btn" type="button" @click="handleAdd">新增</button>
      </div>
      <ul class="activity-list">
        <li v-if="!partner.activities.length" class="empty">還沒有活動，先新增一個吧 💕</li>
        <li v-else v-for="(item, idx) in partner.activities" :key="idx" class="list-item">
          <span class="activity-text">{{ item }}</span>
          <button class="delete-btn" type="button" @click="$emit('delete-activity', partner.id, item)">🗑 刪除</button>
        </li>
      </ul>
    </div>
  `,
  setup(props, { emit }) {
    const inputText = ref('');
    const handleAdd = () => {
      if (!inputText.value) return;
      emit('add-activity', props.partner.id, inputText.value);
      inputText.value = '';
    };
    return { inputText, handleAdd };
  }
};

createApp({
  components: { PartnerCard },
  setup() {
    const partners = ref([
      {
        id: 'male',
        title: 'Jacky',
        icon: '👨',
        cssClass: 'male',
        placeholder: '例如：看電影',
        activities: [],
        selected: []
      },
      {
        id: 'female',
        title: '紫紫',
        icon: '👩',
        cssClass: 'female',
        placeholder: '例如：吃甜點',
        activities: [],
        selected: []
      }
    ]);

    const loading = ref(false);
    const spinning = ref(false);
    const currentRotation = ref(0);
    const currentWheelItems = ref([]);
    const resultState = ref({ type: 'normal', msg: '' });

    // 計算屬性：所有活動 (去重)
    const allActivities = computed(() => {
      const all = partners.value.flatMap(p => p.activities);
      return [...new Set(all)];
    });

    // 計算屬性：共同選擇
    const commonActivities = computed(() => {
      if (partners.value.length < 2) return [];
      const maleSel = partners.value[0].selected;
      const femaleSel = partners.value[1].selected;
      return maleSel.filter(x => femaleSel.includes(x));
    });

    // 輪播背景與轉速控制
    const wheelStyle = computed(() => {
      const items = currentWheelItems.value;
      if (!items.length) return { background: '#ddd', transform: `rotate(${currentRotation.value}deg)` };

      const angle = 360 / items.length;
      const gradients = items.map((_, i) => `${COLORS[i % COLORS.length]} ${i * angle}deg ${(i + 1) * angle}deg`);
      
      return {
        background: `conic-gradient(${gradients.join(',')})`,
        transform: `rotate(${currentRotation.value}deg)`
      };
    });

    const getSegmentStyle = (index) => {
      const total = currentWheelItems.value.length;
      const angle = 360 / total;
      return {
        transform: `rotate(${index * angle + angle / 2}deg) translate(130px) rotate(90deg)`
      };
    };

    // 新增活動 [POST]
    const addActivity = async (partnerId, text) => {
      const partner = partners.value.find(p => p.id === partnerId);
      if (partner.activities.includes(text)) {
        resultState.value = { type: 'normal', msg: '這個活動已經存在囉 💕' };
        return;
      }
      partner.activities.push(text);

      await apiService.addActivity(partnerId, text);
      await apiService.syncAllData(partners.value);
    };

    // 刪除活動 [POST]
    const deleteActivity = async (partnerId, text) => {
      const partner = partners.value.find(p => p.id === partnerId);
      const idx = partner.activities.indexOf(text);
      if (idx > -1) partner.activities.splice(idx, 1);
      
      // 清理勾選項目
      partners.value.forEach(p => {
        p.selected = p.selected.filter(x => x !== text);
      });

      await apiService.deleteActivity(partnerId, text);
      await apiService.syncAllData(partners.value);
    };

    // 切換勾選狀態 [POST]
    const toggleSelection = async (partnerId, text) => {
      const partner = partners.value.find(p => p.id === partnerId);
      if (!partner) return;

      const idx = partner.selected.indexOf(text);
      let isSelected = false;

      if (idx > -1) {
        partner.selected.splice(idx, 1);
        isSelected = false;
      } else {
        partner.selected.push(text);
        isSelected = true;
      }

      await apiService.toggleSelection(partnerId, text, isSelected);
      await apiService.syncAllData(partners.value);
    };

    // 尋找共同點
    const findMatch = () => {
      if (!commonActivities.value.length) {
        resultState.value = { type: 'normal', msg: '目前沒有共同意願 💭' };
        return;
      }
      resultState.value = { type: 'match', msg: commonActivities.value.join('、') };
    };

    // 旋轉轉盤
    const spin = (items, modeName) => {
      if (spinning.value) return;

      const uniqueItems = [...new Set(items)];
      if (!uniqueItems.length) {
        resultState.value = {
          type: 'normal',
          msg: modeName === '共識' ? '目前沒有共同意願，先勾選雙方都願意的活動 💕' : '沒有可抽選的項目，先新增活動吧 💕'
        };
        return;
      }

      spinning.value = true;
      currentWheelItems.value = uniqueItems;

      const selectedIndex = Math.floor(Math.random() * uniqueItems.length);
      const selectedItem = uniqueItems[selectedIndex];
      const segmentAngle = 360 / uniqueItems.length;

      const target = 360 - (selectedIndex * segmentAngle + segmentAngle / 2);
      const normalizedCurrent = ((currentRotation.value % 360) + 360) % 360;
      const delta = (target - normalizedCurrent + 360) % 360;

      currentRotation.value += 360 * 5 + delta;
      resultState.value = { type: 'status', msg: `🎡 ${modeName}轉盤旋轉中...` };

      setTimeout(() => {
        spinning.value = false;
        launchConfetti();
        resultState.value = { type: 'winner', winner: selectedItem };
      }, 5000);
    };

    const launchConfetti = () => {
      const confettiColors = ["#FF4D6D","#FFD166","#6BCB77","#6EC1FF","#B983FF","#FF8FAB"];
      for (let i = 0; i < 100; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * window.innerWidth + "px";
        c.style.width = 5 + Math.random() * 8 + "px";
        c.style.height = 6 + Math.random() * 12 + "px";
        c.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
        c.style.animationDuration = 2 + Math.random() * 2 + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 4000);
      }
    };

    // 初始化讀取資料 [POST]
    const loadData = async () => {
      loading.value = true;
      try {
        const savedData = await apiService.fetchPartnersData();
        if (savedData && Array.isArray(savedData)) {
          savedData.forEach(sData => {
            const partner = partners.value.find(p => p.id === sData.id);
            if (partner) {
              partner.activities = Array.isArray(sData.activities) ? sData.activities : [];
              partner.selected = Array.isArray(sData.selected) ? sData.selected : [];
            }
          });
        }
      } catch (e) {
        console.error("載入資料失敗:", e);
      } finally {
        loading.value = false;
        currentWheelItems.value = commonActivities.value;
      }
    };

    onMounted(() => {
      loadData();
    });

    return {
      partners,
      loading,
      spinning,
      allActivities,
      commonActivities,
      currentWheelItems,
      wheelStyle,
      resultState,
      getSegmentStyle,
      addActivity,
      deleteActivity,
      toggleSelection,
      findMatch,
      spin
    };
  }
}).mount('#app');
</script>
</body>
</html>
